            <div class="flex items-center gap-3"><span class="flex h-10 w-10 items-center justify-center rounded-xl bg-white text-sky-600 shadow-sm"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#icon-pin"/></svg></span><div><p data-cms="booking.address_label" class="text-xs text-slate-500"></p><p id="booking-address" class="text-sm font-bold text-slate-900"></p></div></div>
          </div>
          <p class="mt-8 inline-flex items-center gap-2 rounded-lg bg-mint-50 px-3 py-2 text-xs font-semibold text-mint-600"><svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2"><use href="#icon-check"/></svg><span data-cms="booking.welcome_badge"></span></p>
        </div>
        <form id="booking-form" class="rounded-2xl border border-slate-100 bg-white p-6 shadow-soft sm:p-8" novalidate>
          <h3 data-cms="booking.form_title" class="display-font text-xl font-bold text-slate-900"></h3><p data-cms="booking.form_description" class="mt-1 text-sm text-slate-500"></p>
          <div class="mt-6 grid gap-5 sm:grid-cols-2">
            <div><label id="name-label" for="full-name" class="mb-1.5 block text-xs font-bold text-slate-700"></label><input id="full-name" name="name" type="text" autocomplete="name" required class="w-full rounded-lg border border-slate-200 bg-white px-3.5 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-sky-400 focus:ring-4 focus:ring-sky-100"></div>
            <div><label id="phone-field-label" for="phone" class="mb-1.5 block text-xs font-bold text-slate-700"></label><input id="phone" name="phone" type="tel" autocomplete="tel" required class="w-full rounded-lg border border-slate-200 bg-white px-3.5 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-sky-400 focus:ring-4 focus:ring-sky-100"></div>
            <div><label id="email-label" for="email" class="mb-1.5 block text-xs font-bold text-slate-700"></label><input id="email" name="email" type="email" autocomplete="email" class="w-full rounded-lg border border-slate-200 bg-white px-3.5 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-sky-400 focus:ring-4 focus:ring-sky-100"></div>
            <div><label id="service-label" for="service" class="mb-1.5 block text-xs font-bold text-slate-700"></label><select id="service" name="service" required class="w-full rounded-lg border border-slate-200 bg-white px-3.5 py-3 text-sm text-slate-700 outline-none transition focus:border-sky-400 focus:ring-4 focus:ring-sky-100"></select></div>
            <div class="sm:col-span-2"><label id="date-label" for="date" class="mb-1.5 block text-xs font-bold text-slate-700"></label><div class="relative"><input id="date" name="date" type="date" required class="w-full rounded-lg border border-slate-200 bg-white px-3.5 py-3 text-sm text-slate-700 outline-none transition focus:border-sky-400 focus:ring-4 focus:ring-sky-100"><svg class="pointer-events-none absolute right-3.5 top-3.5 h-4 w-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#icon-calendar"/></svg></div></div>
          </div>
          <div id="booking-message" role="status" aria-live="polite" class="mt-4 hidden rounded-lg px-4 py-3 text-sm"></div>
          <button type="submit" class="mt-6 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-sky-500 px-6 py-3.5 text-sm font-bold text-white shadow-md shadow-sky-500/20 transition hover:bg-sky-600"><span data-cms="booking.submit_label"></span><svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2"><use href="#icon-arrow"/></svg></button>
          <p data-cms="booking.consent_text" class="mt-3 text-center text-xs leading-5 text-slate-400"></p>
        </form>
      </div>
    </section>
  </main>

  <footer id="contact" class="bg-sky-950 text-sky-100">
    <div class="mx-auto grid max-w-7xl gap-10 px-5 py-14 sm:px-8 md:grid-cols-2 lg:grid-cols-4">
      <div><a href="#home" class="inline-flex items-center gap-2.5"><span class="flex h-10 w-10 items-center justify-center rounded-xl bg-sky-500 text-white"><svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.7"><use href="#icon-tooth"/></svg></span><span class="display-font text-lg font-extrabold leading-tight tracking-tight text-white"><span data-cms="site.brand_word"></span><span class="text-sky-400">.</span><span data-cms="site.brand_suffix" class="block text-[10px] font-semibold tracking-[0.18em] text-sky-100/60"></span></span></a><p data-cms="footer.description" class="mt-4 max-w-xs text-sm leading-6 text-sky-100/65"></p></div>
      <div><h3 data-cms="footer.quick_links_title" class="text-sm font-bold text-white"></h3><ul id="footer-links" class="mt-4 space-y-3 text-sm text-sky-100/65"></ul></div>
      <div><h3 data-cms="footer.contact_title" class="text-sm font-bold text-white"></h3><ul class="mt-4 space-y-3 text-sm text-sky-100/65"><li id="footer-address" class="flex items-start gap-2"><svg class="mt-0.5 h-4 w-4 shrink-0 text-sky-400" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#icon-pin"/></svg><span></span></li><li id="footer-phone-item"><a id="footer-phone" class="flex items-center gap-2 transition hover:text-white"><svg class="h-4 w-4 text-sky-400" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#icon-phone"/></svg><span></span></a></li><li id="footer-email-item"><a id="footer-email" class="transition hover:text-white"></a></li></ul></div>
      <div><h3 data-cms="footer.hours_title" class="text-sm font-bold text-white"></h3><ul id="footer-hours" class="mt-4 space-y-3 text-sm text-sky-100/65"></ul><a id="footer-emergency" href="tel:+12145550199" class="mt-5 inline-flex items-center gap-2 text-sm font-semibold text-mint-400 transition hover:text-mint-300"><span class="h-2 w-2 rounded-full bg-mint-500"></span><span data-cms="footer.emergency_link_label"></span></a></div>
    </div>
    <div class="border-t border-white/10"><div class="mx-auto flex max-w-7xl flex-col gap-2 px-5 py-5 text-xs text-sky-100/50 sm:flex-row sm:items-center sm:justify-between sm:px-8"><p>© <span id="current-year"></span> <span data-cms="footer.copyright"></span></p><p><span data-cms="footer.closing_note"></span> <span class="text-rose-300">♥</span></p></div></div>
  </footer>

  <div id="chat-panel" class="fixed bottom-24 right-4 z-50 hidden w-[calc(100vw-2rem)] max-w-[380px] overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl shadow-slate-950/20 sm:right-6" role="dialog" aria-modal="false" aria-labelledby="chat-title">
    <div class="flex items-center justify-between bg-sky-950 px-5 py-4"><div class="flex items-center gap-3"><span class="relative flex h-10 w-10 items-center justify-center rounded-full bg-sky-500 text-white"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#icon-sparkles"/></svg><span class="absolute bottom-0 right-0 h-3 w-3 rounded-full border-2 border-sky-950 bg-mint-500"></span></span><div><h2 id="chat-title" data-cms="chat.title" class="text-sm font-bold text-white"></h2><p data-cms="chat.status" class="mt-0.5 text-[11px] text-sky-100/70"></p></div></div><button id="chat-close" type="button" class="flex h-8 w-8 items-center justify-center rounded-lg text-sky-100/70 transition hover:bg-white/10 hover:text-white"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#icon-x"/></svg><span class="sr-only" data-cms="chat.close_label"></span></button></div>
    <div id="chat-messages" class="chat-scroll flex h-[320px] flex-col gap-3 overflow-y-auto bg-slate-50 px-4 py-4" aria-live="polite"><div id="chat-welcome" class="max-w-[92%] self-start rounded-2xl rounded-tl-sm border border-slate-100 bg-white px-3.5 py-3 text-sm leading-5 text-slate-700 shadow-sm"><p id="chat-welcome-text"></p><div id="chat-quick-replies" class="mt-3 flex flex-wrap gap-2"></div></div></div>
    <form id="chat-form" class="flex items-center gap-2 border-t border-slate-100 bg-white p-3"><label for="chat-input" class="sr-only" data-cms="chat.input_label"></label><input id="chat-input" type="text" autocomplete="off" class="min-w-0 flex-1 rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none transition placeholder:text-slate-400 focus:border-sky-400 focus:ring-4 focus:ring-sky-100"><button id="chat-send" type="submit" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-sky-500 text-white transition hover:bg-sky-600"><svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#icon-send"/></svg></button></form>
  </div>
  <button id="chat-toggle" type="button" class="fixed bottom-5 right-4 z-50 flex h-14 items-center gap-2.5 rounded-full bg-sky-500 px-5 text-white shadow-lg shadow-sky-500/30 transition hover:-translate-y-1 hover:bg-sky-600 sm:bottom-6 sm:right-6" aria-expanded="false" aria-controls="chat-panel"><svg id="chat-toggle-icon" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#icon-chat"/></svg><span id="chat-toggle-label" class="text-sm font-bold"></span></button>

  <script>
    const allowedIcons = new Set(['sparkles', 'heart', 'wallet', 'clock', 'toothbrush', 'sun', 'smile', 'implant', 'align']);
    const colorStyles = {
      sky: 'bg-sky-100 text-sky-700',
      mint: 'bg-mint-100 text-mint-600',
      violet: 'bg-violet-100 text-violet-700'
    };

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);

    function safeHref(value, fallback = '#') {
      const href = String(value ?? '').trim();
      if (/^#[\w-]+$/.test(href) || /^(tel|mailto):[+\w.@-]+$/i.test(href) || /^https:\/\/[^\s]+$/i.test(href)) return href;
      return fallback;
    }

    function safeImageSource(value) {
      const source = String(value ?? '').trim();
      return /^https:\/\/[^\s]+$/i.test(source) || /^\/(?!\/)[^\s]*$/.test(source) ? source : '';
    }

    function getValue(data, path) {
      return path.split('.').reduce((value, key) => value && value[key], data);
    }

    function text(data, path) {
      const value = getValue(data, path);
      return typeof value === 'string' || typeof value === 'number' ? String(value) : '';
    }

    function setText(data, path, selector = `[data-cms="${path}"]`) {
      document.querySelectorAll(selector).forEach((element) => {
        element.textContent = text(data, path);
      });
    }

    function icon(name, classes = 'h-6 w-6') {
      const validName = allowedIcons.has(name) ? name : 'heart';
      return `<svg class="${classes}" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><use href="#icon-${validName}"></use></svg>`;
    }

    function renderNavigation(data) {
      const links = Array.isArray(data.navigation.links) ? data.navigation.links : [];
      document.getElementById('desktop-nav-links').innerHTML = links.map((link) =>
        `<a href="${escapeHtml(safeHref(link.href))}" class="text-sm font-semibold text-slate-600 transition hover:text-sky-600">${escapeHtml(link.label)}</a>`
      ).join('');
      const mobileLinks = links.map((link) =>
        `<a href="${escapeHtml(safeHref(link.href))}" class="mobile-nav-link rounded-lg px-3 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">${escapeHtml(link.label)}</a>`
      ).join('');
      document.getElementById('mobile-nav-links').innerHTML = `${mobileLinks}<a href="#booking" class="mobile-nav-link mt-2 rounded-lg bg-sky-500 px-4 py-3 text-center text-sm font-bold text-white">${escapeHtml(data.navigation.appointment_label)}</a>`;
    }

    function renderTrustBadges(data) {
      const badges = Array.isArray(data.hero.trust_badges) ? data.hero.trust_badges : [];
      document.getElementById('trust-badges').innerHTML = badges.map((badge) =>
        `<div><p class="display-font text-xl font-extrabold text-slate-900 sm:text-2xl">${escapeHtml(badge.value)}<span class="text-sky-500">${escapeHtml(badge.suffix)}</span></p><p class="mt-1 text-[11px] leading-4 text-slate-500 sm:text-xs">${escapeHtml(badge.label)}</p></div>`
      ).join('');
    }

    function renderDoctor(data) {
      const doctor = data.doctor;
      document.getElementById('doctor-paragraphs').innerHTML = (Array.isArray(doctor.paragraphs) ? doctor.paragraphs : [])
        .map((paragraph) => `<p>${escapeHtml(paragraph)}</p>`).join('');
      document.getElementById('doctor-highlights').innerHTML = (Array.isArray(doctor.highlights) ? doctor.highlights : [])
        .map((item) => `<div class="flex items-start gap-3"><span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-mint-50 text-mint-600">${icon('heart', 'h-3.5 w-3.5')}</span><div><h3 class="text-sm font-bold text-slate-900">${escapeHtml(item.title)}</h3><p class="mt-1 text-xs leading-5 text-slate-500">${escapeHtml(item.description)}</p></div></div>`).join('');
    }

    function renderFeatures(data) {
      document.getElementById('features-grid').innerHTML = (Array.isArray(data.features_section.features) ? data.features_section.features : [])
        .map((item) => `<article class="rounded-2xl border border-slate-100 bg-slate-50/70 p-6 transition hover:-translate-y-1 hover:shadow-card"><span class="flex h-12 w-12 items-center justify-center rounded-xl bg-sky-100 text-sky-600">${icon(item.icon)}</span><h3 class="display-font mt-5 text-base font-bold text-slate-900">${escapeHtml(item.title)}</h3><p class="mt-2 text-sm leading-6 text-slate-600">${escapeHtml(item.description)}</p></article>`).join('');
    }

    function renderServices(data) {
      document.getElementById('services-grid').innerHTML = (Array.isArray(data.services_section.services) ? data.services_section.services : [])
        .map((item) => {
          const price = item.price_is_phone
            ? `<a href="${escapeHtml(phoneHref(data.site.phone_link))}" class="text-sm font-bold text-sky-600 hover:text-sky-700">${escapeHtml(item.price)}</a>`
            : `<span class="text-sm font-bold ${item.price === 'Complimentary' ? 'text-mint-600' : 'text-slate-900'}">${escapeHtml(item.price)}</span>`;
          return `<article class="group rounded-2xl border border-slate-100 bg-white p-6 shadow-sm transition hover:-translate-y-1 hover:shadow-card sm:p-7"><div class="flex items-start justify-between"><span class="flex h-12 w-12 items-center justify-center rounded-xl bg-sky-50 text-sky-600">${icon(item.icon)}</span><span class="rounded-full bg-slate-50 px-3 py-1 text-xs font-semibold text-slate-500">${escapeHtml(item.category)}</span></div><h3 class="display-font mt-5 text-lg font-bold text-slate-900">${escapeHtml(item.title)}</h3><p class="mt-2 min-h-[48px] text-sm leading-6 text-slate-600">${escapeHtml(item.description)}</p><div class="mt-5 flex items-center justify-between border-t border-slate-100 pt-4"><span class="text-xs font-medium text-slate-500">${escapeHtml(item.price_label)}</span>${price}</div></article>`;
        }).join('');
    }

    function renderReviews(data) {
      document.getElementById('reviews-grid').innerHTML = (Array.isArray(data.reviews_section.reviews) ? data.reviews_section.reviews : [])
        .map((review) => {
          const stars = Math.max(0, Math.min(5, Number(review.stars) || 0));
          const avatar = colorStyles[review.avatar_color] || colorStyles.sky;
          return `<article class="flex flex-col rounded-2xl border border-slate-100 bg-slate-50/70 p-6 sm:p-7"><div class="flex items-center justify-between"><span class="tracking-[0.16em] text-amber-400" aria-label="${stars} out of 5 stars">${'★'.repeat(stars)}</span><svg class="h-5 w-5 text-sky-200" fill="currentColor" stroke="none" aria-hidden="true"><use href="#icon-quote"></use></svg></div><blockquote class="mt-5 flex-1 text-sm leading-7 text-slate-600">“${escapeHtml(review.quote)}”</blockquote><div class="mt-6 flex items-center justify-between border-t border-slate-200 pt-5"><div class="flex items-center gap-3"><span class="flex h-10 w-10 items-center justify-center rounded-full ${avatar} text-sm font-bold">${escapeHtml(review.initials)}</span><div><p class="text-sm font-bold text-slate-900">${escapeHtml(review.patient_name)}</p><p class="text-xs text-slate-500">${escapeHtml(review.patient_since)}</p></div></div><span class="inline-flex items-center gap-1 rounded-full bg-mint-50 px-2 py-1 text-[10px] font-bold text-mint-600">${icon('heart', 'h-3 w-3')} ${escapeHtml(data.reviews_section.verified_label)}</span></div></article>`;
        }).join('');
    }

    function phoneHref(value) {
      const digits = String(value ?? '').replace(/\D/g, '');
      if (digits.length < 7 || digits.length > 15) return '#';
      return `tel:+${digits.startsWith('1') ? digits : `1${digits}`}`;
    }

    function renderBooking(data) {
      const booking = data.booking;
      const service = document.getElementById('service');
      service.innerHTML = `<option value="">${escapeHtml(booking.service_placeholder)}</option>` +
        (Array.isArray(booking.service_options) ? booking.service_options : [])
          .map((option) => `<option value="${escapeHtml(option)}">${escapeHtml(option)}</option>`).join('');
      const requiredMark = '<span class="text-rose-500" aria-hidden="true"> *</span>';
      document.getElementById('name-label').innerHTML = `${escapeHtml(booking.name_label)}${requiredMark}`;
      document.getElementById('phone-field-label').innerHTML = `${escapeHtml(booking.phone_field_label)}${requiredMark}`;
      document.getElementById('email-label').textContent = booking.email_label;
      document.getElementById('service-label').innerHTML = `${escapeHtml(booking.service_label)}${requiredMark}`;
      document.getElementById('date-label').innerHTML = `${escapeHtml(booking.date_label)}${requiredMark}`;
      document.getElementById('full-name').placeholder = booking.name_placeholder;
      document.getElementById('phone').placeholder = booking.phone_placeholder;
      document.getElementById('email').placeholder = booking.email_placeholder;
      document.getElementById('phone').autocomplete = 'tel';
      const href = phoneHref(data.site.phone_link);
      document.getElementById('booking-phone').href = href;
      document.getElementById('booking-phone').textContent = data.site.phone_number;
      document.getElementById('booking-hours').textContent = data.site.hours_notice;
      document.getElementById('booking-address').textContent = data.site.address;
    }

    function renderFooter(data) {
      const footer = data.footer;
      document.getElementById('footer-links').innerHTML = (Array.isArray(footer.quick_links) ? footer.quick_links : [])
        .map((link) => `<li><a class="transition hover:text-white" href="${escapeHtml(safeHref(link.href))}">${escapeHtml(link.label)}</a></li>`).join('');
      document.getElementById('footer-hours').innerHTML = (Array.isArray(footer.clinic_hours) ? footer.clinic_hours : [])
        .map((hours) => `<li class="flex justify-between gap-4"><span>${escapeHtml(hours.day)}</span><span class="text-white">${escapeHtml(hours.hours)}</span></li>`).join('');
      document.querySelector('#footer-address span').textContent = data.site.address;
      document.querySelector('#footer-phone span').textContent = data.site.phone_number;
      document.getElementById('footer-phone').href = phoneHref(data.site.phone_link);
      document.getElementById('footer-emergency').href = phoneHref(data.site.phone_link);
      const emailItem = document.getElementById('footer-email-item');
      if (data.site.email) {
        const email = String(data.site.email).trim();
        document.getElementById('footer-email').href = `mailto:${email.replace(/[^\w.+@-]/g, '')}`;
        document.getElementById('footer-email').textContent = email;
        emailItem.hidden = false;
      } else {
        emailItem.hidden = true;
      }
    }

    function renderChat(data) {
      document.getElementById('chat-welcome-text').textContent = data.chat.welcome_message;
      document.getElementById('chat-toggle-label').textContent = data.chat.toggle_label;
      document.getElementById('chat-input').placeholder = data.chat.input_placeholder;
      document.getElementById('chat-close').setAttribute('aria-label', data.chat.close_label);
      document.getElementById('chat-send').setAttribute('aria-label', data.chat.send_label);
      document.getElementById('chat-input').setAttribute('aria-label', data.chat.input_label);
      document.getElementById('chat-toggle').setAttribute('aria-label', data.chat.open_accessibility_label);
      document.getElementById('chat-quick-replies').innerHTML = (Array.isArray(data.chat.quick_replies) ? data.chat.quick_replies : [])
        .map((reply) => `<button type="button" data-prompt="${escapeHtml(reply.prompt)}" class="quick-reply rounded-full border border-sky-100 bg-sky-50 px-3 py-1.5 text-xs font-semibold text-sky-700 transition hover:bg-sky-100">${escapeHtml(reply.label)}</button>`).join('');
    }

    function hydrate(data) {
      document.title = text(data, 'site.page_title');
      document.querySelector('meta[name="description"]').content = text(data, 'site.meta_description');
      document.getElementById('brand-link').setAttribute('aria-label', `${data.site.name} home`);
      document.querySelector('nav[aria-label]').setAttribute('aria-label', `${data.site.name} navigation`);
      document.querySelectorAll('[data-cms]').forEach((element) => {
        const value = getValue(data, element.dataset.cms);
        if (typeof value === 'string' || typeof value === 'number') element.textContent = String(value);
      });
      document.getElementById('hero-title').textContent = data.hero.title;
      document.getElementById('hero-subtitle').textContent = data.hero.subtitle;
      document.getElementById('doctor-title').textContent = data.doctor.title;
      document.getElementById('hero-image').src = safeImageSource(data.hero.image);
      document.getElementById('hero-image').alt = data.hero.image_alt;
      document.getElementById('doctor-image').src = safeImageSource(data.doctor.image);
      document.getElementById('doctor-image').alt = data.doctor.image_alt;
      const href = phoneHref(data.site.phone_link);
      document.getElementById('phone-number').textContent = data.site.phone_number;
      ['emergency-phone-link', 'hero-call-link'].forEach((id) => document.getElementById(id).href = href);
      renderNavigation(data);
      renderTrustBadges(data);
      renderDoctor(data);
      renderFeatures(data);
      renderServices(data);
      renderReviews(data);
      renderBooking(data);
      renderFooter(data);
      renderChat(data);
      menuToggle.setAttribute('aria-label', data.navigation.menu_open_label);
      document.getElementById('mobile-menu').setAttribute('aria-label', `${data.site.name} mobile navigation`);
      document.getElementById('chat-panel').setAttribute('aria-labelledby', 'chat-title');
      document.getElementById('current-year').textContent = new Date().getFullYear();
      document.body.classList.add('cms-ready');
    }

    const menuToggle = document.getElementById('menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    const menuIcon = document.querySelector('#menu-icon use');
    menuToggle.addEventListener('click', () => {
      const open = menuToggle.getAttribute('aria-expanded') !== 'true';
      menuToggle.setAttribute('aria-expanded', String(open));
      const labels = window.homepageContent && window.homepageContent.navigation;
      if (labels) menuToggle.setAttribute('aria-label', open ? labels.menu_close_label : labels.menu_open_label);
      mobileMenu.classList.toggle('hidden', !open);
      menuIcon.setAttribute('href', open ? '#icon-x' : '#icon-menu');
    });
    document.getElementById('mobile-nav-links').addEventListener('click', (event) => {
      if (!event.target.closest('a')) return;
      mobileMenu.classList.add('hidden');
      menuToggle.setAttribute('aria-expanded', 'false');
      if (window.homepageContent) menuToggle.setAttribute('aria-label', window.homepageContent.navigation.menu_open_label);
      menuIcon.setAttribute('href', '#icon-menu');
    });

    const bookingForm = document.getElementById('booking-form');
    const bookingMessage = document.getElementById('booking-message');
    const dateInput = document.getElementById('date');
    const now = new Date();
    dateInput.min = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().split('T')[0];
    bookingForm.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!bookingForm.reportValidity()) return;
      const name = document.getElementById('full-name').value.trim();
      bookingMessage.className = 'mt-4 rounded-lg bg-mint-50 px-4 py-3 text-sm font-medium text-mint-600';
      bookingMessage.textContent = window.homepageContent.booking.success_message.replace('{name}', name);
      bookingForm.reset();
    });

    const chatToggle = document.getElementById('chat-toggle');
    const chatPanel = document.getElementById('chat-panel');
    const chatInput = document.getElementById('chat-input');
    const chatMessages = document.getElementById('chat-messages');
    function setChatOpen(open) {
      if (!window.homepageContent) return;
      chatPanel.classList.toggle('hidden', !open);
      chatToggle.setAttribute('aria-expanded', String(open));
      chatToggle.setAttribute('aria-label', open ? window.homepageContent.chat.close_accessibility_label : window.homepageContent.chat.open_accessibility_label);
      document.querySelector('#chat-toggle-icon use').setAttribute('href', open ? '#icon-x' : '#icon-chat');
      if (open) chatInput.focus();
    }
    chatToggle.addEventListener('click', () => setChatOpen(chatToggle.getAttribute('aria-expanded') !== 'true'));
    document.getElementById('chat-close').addEventListener('click', () => setChatOpen(false));

    function addChatMessage(message, isUser) {
      const element = document.createElement('div');
      element.className = isUser
        ? 'max-w-[88%] self-end rounded-2xl rounded-tr-sm bg-sky-500 px-3.5 py-2.5 text-sm leading-5 text-white shadow-sm'
        : 'max-w-[92%] self-start rounded-2xl rounded-tl-sm border border-slate-100 bg-white px-3.5 py-2.5 text-sm leading-5 text-slate-700 shadow-sm';
      element.textContent = message;
      chatMessages.appendChild(element);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    function getBotReply(prompt) {
      const content = window.homepageContent;
      const query = prompt.toLowerCase();
      let category = 'default';
      if (/clean|book|appointment|schedule/.test(query)) category = 'booking';
      else if (/insurance|coverage|plan/.test(query)) category = 'insurance';
      else if (/emergency|urgent|pain|toothache/.test(query)) category = 'emergency';
      else if (/hour|open|time/.test(query)) category = 'hours';
      else if (/price|cost|financ/.test(query)) category = 'cost';
      else if (/address|location|where/.test(query)) category = 'location';
      return content.chat.replies[category].replaceAll('{phone}', content.site.phone_number);
    }
    function sendChatMessage(value) {
      const prompt = String(value || '').trim();
      if (!prompt) return;
      addChatMessage(prompt, true);
      chatInput.value = '';
      window.setTimeout(() => addChatMessage(getBotReply(prompt), false), 350);
    }
    document.getElementById('chat-form').addEventListener('submit', (event) => {
      event.preventDefault();
      sendChatMessage(chatInput.value);
    });
    document.getElementById('chat-quick-replies').addEventListener('click', (event) => {
      const button = event.target.closest('.quick-reply');
      if (button) sendChatMessage(button.dataset.prompt);
    });

    fetch('/content/homepage.json')
      .then((response) => {
        if (!response.ok) throw new Error(`Homepage content request failed (${response.status}).`);
        return response.json();
      })
      .then((content) => {
        if (!content || typeof content !== 'object' || !content.site || !content.hero || !content.chat || !content.booking) {
          throw new Error('Homepage content is missing required sections.');
        }
        window.homepageContent = content;
        hydrate(content);
      })
      .catch((error) => {
        console.error('Unable to load Apex Dental Clinic CMS content.', error);
        const errorBanner = document.getElementById('content-error');
        errorBanner.textContent = 'We’re having trouble loading this page right now. Please call the clinic for assistance.';
        errorBanner.classList.remove('hidden');
      });

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', (user) => {
        if (!user) window.netlifyIdentity.on('login', () => { window.location.href = '/admin/'; });
      });
    }
  </script>
</body>
</html>
